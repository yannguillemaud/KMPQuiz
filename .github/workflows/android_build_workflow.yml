name: CI/CD Build and Deploy APK

on:
  push:
    tags:
      - 'v[1-9]*.[0-9]*.*'
      - '[1-9]*.[0-9]*.*'
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Build APK based on trigger
        id: build_step
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "Valid release tag detected. Building Release APK..."
            ./gradlew :androidApp:assembleRelease --stacktrace --build-cache
          
            echo "APK_PATH=androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk" >> $GITHUB_ENV
            echo "IS_RELEASE=true" >> $GITHUB_ENV
          else
            echo "Branch detected. Building Debug APK..."
            ./gradlew :androidApp:assembleDebug --stacktrace --build-cache
          
            echo "APK_PATH=androidApp/build/outputs/apk/debug/androidApp-debug.apk" >> $GITHUB_ENV
            echo "IS_RELEASE=false" >> $GITHUB_ENV
          fi

      - name: Fail if APK missing
        run: |
          if [ ! -f "${{ env.APK_PATH }}" ]; then
            echo "ERROR: APK not found at ${{ env.APK_PATH }}"
            exit 1
          fi
          echo "APK successfully found at ${{ env.APK_PATH }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ env.IS_RELEASE == 'true' && 'release' || 'debug' }}-apk
          path: ${{ env.APK_PATH }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}