name: CI/CD Build and Deploy APK

on:
  push:
    tags:
      - 'v[1-9]*.[0-9]*.*'
      - '[1-9]*.[0-9]*.*'
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Derive version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          RAW_TAG="${{ github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "Derived versionCode=$VERSION_CODE versionName=$VERSION from tag $RAW_TAG"

      - name: Build APK based on trigger
        id: build_step
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "Valid release tag detected. Building signed Release APK..."
            ./gradlew :androidApp:assembleRelease --stacktrace --build-cache

            APK_PATH=$(find androidApp/build/outputs/apk/release -maxdepth 1 -name "*.apk" | head -n 1)
            echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
            echo "IS_RELEASE=true" >> $GITHUB_ENV
          else
            echo "Branch detected. Building signed Debug APK..."
            ./gradlew :androidApp:assembleDebug --stacktrace --build-cache

            APK_PATH=$(find androidApp/build/outputs/apk/debug -maxdepth 1 -name "*.apk" | head -n 1)
            echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
            echo "IS_RELEASE=false" >> $GITHUB_ENV
          fi

      - name: Fail if APK missing
        run: |
          if [ ! -f "${{ env.APK_PATH }}" ]; then
            echo "ERROR: APK not found at ${{ env.APK_PATH }}"
            exit 1
          fi
          echo "APK successfully found at ${{ env.APK_PATH }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ env.IS_RELEASE == 'true' && 'release' || 'debug' }}-apk
          path: ${{ env.APK_PATH }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}